{% extends 'base/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <!-- Redesigned entry form with cleaner card layout -->
  <div class="section-spacing" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); min-height: 100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <!-- Form Card -->
          <div class="card border-0 shadow-sm" style="border-radius: 16px;">
            <!-- Header -->
            <div class="card-header bg-white border-0 p-4 pb-0">
              <h1 class="h3 fw-bold mb-1">Password changed successfully</h1>
            </div>
            <div class="card-body p-4">
              <div class="alert alert-success" role="alert">
                Your password has been changed successfully. You can now <a href="{% url 'login' %}" class="alert-link">log in</a> with your new password.
              </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
