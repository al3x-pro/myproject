<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Verified</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0e0e10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      padding: 24px;
      overflow: hidden;
    }

    /* confetti particles */
    .particle {
      position: fixed;
      top: -10px;
      width: 8px; height: 8px;
      border-radius: 2px;
      animation: fall linear forwards;
      opacity: 0;
    }

    @keyframes fall {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
    }

    .card {
      max-width: 460px;
      width: 100%;
      background: #16161a;
      border: 1px solid #2a2a30;
      border-radius: 20px;
      padding: 56px 48px;
      text-align: center;
      animation: fadeUp 0.5s ease both;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .checkmark-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      font-size: 32px;
      margin-bottom: 28px;
      animation: pop 0.4s 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes pop {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      color: #f0f0ea;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-block;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: #34d399;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: #808088;
      margin-bottom: 36px;
    }

    .btn {
      display: block;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="checkmark-wrap">✓</div>

    <h1>You're verified!</h1>
    <span class="badge">Email confirmed</span>

    <p>
      Your email address has been successfully verified.
      You're now logged in and ready to go.
    </p>

    <a href="{% url 'myapp:entry-list' %}" class="btn">Go to your dashboard →</a>
  </div>

  <script>
    // Spawn confetti on load
    const colors = ['#6366f1','#8b5cf6','#34d399','#f59e0b','#ec4899'];
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.width = (6 + Math.random() * 8) + 'px';
      p.style.height = (6 + Math.random() * 8) + 'px';
      p.style.animationDuration = (2 + Math.random() * 3) + 's';
      p.style.animationDelay = (Math.random() * 1.5) + 's';
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
